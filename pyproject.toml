[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "exchange-calendars>=4.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]
quant = ["yfinance==0.2.66"]
retrieval = ["chromadb>=1.0", "sentence-transformers>=3.0"]

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real SEC network checks; opt in with RUN_SEC_INTEGRATION=1"]
